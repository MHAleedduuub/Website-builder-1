<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بناء مواقع الويب بالذكاء الاصطناعي</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS احتياطي */
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            background: #00d4ff;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            margin: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-robot"></i> بناء مواقع بالذكاء الاصطناعي</h1>
        <p>موقعك يعمل! جرب الروابط التالية:</p>
        <div>
            <a href="/dashboard" class="btn">لوحة التحكم</a>
            <a href="/ai-builder" class="btn">المنشئ الذكي</a>
        </div>
        
        <div style="margin-top: 3rem; background: rgba(255,255,255,0.1); padding: 2rem; border-radius: 10px;">
            <h3>إذا ظهرت صفحة خطأ 404، جرب:</h3>
            <p>1. تأكد من وجود ملف `_redirects` في مجلد `public`</p>
            <p>2. أضف هذا السطر فيه: <code>/* /index.html 200</code></p>
            <p>3. أعد النشر على Netlify</p>
        </div>
    </div>
    
    <script>
        // اختبار الاتصال بالخادم
        fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: 'test@test.com', password: '123'})
        })
        .then(res => res.json())
        .then(data => console.log('Server response:', data))
        .catch(err => console.error('Connection error:', err));
    </script>
</body>
</html>
