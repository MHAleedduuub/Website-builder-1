<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بناء مواقع الويب بالذكاء الاصطناعي</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <h2>جاري تحميل التطبيق...</h2>
        <p>موقع بناء المواقع بالذكاء الاصطناعي</p>
    </div>
    
    <div id="app" style="display: none;">
        <!-- سيتم تحميل المحتوى هنا -->
    </div>
    
    <script>
        // تحميل المحتوى الديناميكي
        async function loadContent() {
            try {
                // جلب المحتوى من الخادم
                const response = await fetch('/');
                const html = await response.text();
                
                // إخفاء شاشة التحميل
                document.getElementById('loading').style.display = 'none';
                
                // عرض المحتوى
                document.getElementById('app').innerHTML = html;
                document.getElementById('app').style.display = 'block';
                
                // تشغيل الـ JavaScript بعد تحميل المحتوى
                loadScripts();
                
            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <h2>حدث خطأ في التحميل</h2>
                    <p>${error.message}</p>
                    <button onclick="location.reload()">إعادة المحاولة</button>
                `;
            }
        }
        
        function loadScripts() {
            // تحميل JavaScripts
            const scripts = [
                '/js/app.js'
            ];
            
            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                document.body.appendChild(script);
            });
        }
        
        // بدء التحميل عند اكتمال تحميل الصفحة
        window.addEventListener('DOMContentLoaded', loadContent);
        
        // توجيه SPA
        window.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' && e.target.href) {
                e.preventDefault();
                const href = e.target.getAttribute('href');
                
                if (href.startsWith('/') && !href.startsWith('http')) {
                    window.history.pushState({}, '', href);
                    loadPage(href);
                } else {
                    window.location.href = href;
                }
            }
        });
        
        async function loadPage(path) {
            try {
                const response = await fetch(path);
                const html = await response.text();
                document.getElementById('app').innerHTML = html;
            } catch (error) {
                console.error('Error loading page:', error);
            }
        }
    </script>
</body>
</html>
