<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة - بناء مواقع الويب بالذكاء الاصطناعي</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        }
        
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            max-width: 600px;
        }
        
        .home-link {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1rem;
            transition: transform 0.3s;
        }
        
        .home-link:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1>الصفحة غير موجودة</h1>
        <p class="error-message">
            عذراً، الصفحة التي تبحث عنها غير موجودة. قد تكون الصفحة قد تم نقلها أو حذفها.
        </p>
        <a href="/" class="home-link">
            <i class="fas fa-home"></i> العودة للصفحة الرئيسية
        </a>
        <div style="margin-top: 3rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <a href="/dashboard" class="home-link" style="background: transparent; border: 2px solid white;">
                <i class="fas fa-tachometer-alt"></i> لوحة التحكم
            </a>
            <a href="/ai-builder" class="home-link" style="background: #00AD9F; color: white;">
                <i class="fas fa-magic"></i> بناء موقع بالذكاء الاصطناعي
            </a>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
