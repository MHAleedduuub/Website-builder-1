<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #666;
        }
        
        .home-link {
            background: #4f46e5;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1>الصفحة غير موجودة</h1>
        <p class="error-message">عذراً، لم نتمكن من العثور على الصفحة التي تبحث عنها.</p>
        <a href="/" class="home-link">
            <i class="fas fa-home"></i> العودة للصفحة الرئيسية
        </a>
    </div>
    
    <script>
        // إعادة التوجيه بعد 5 ثواني
        setTimeout(() => {
            window.location.href = '/';
        }, 5000);
    </script>
</body>
</html>
