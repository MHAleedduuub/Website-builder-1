[build]
  command = "npm run build"
  publish = "."
  functions = "api"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { MediaType = "text/html" }

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  publish = "public"
  port = 2091
